[package]
name = "grit-ocr-harness"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "grit-ocr-check"
path = "../../src-tauri/examples/grit-ocr-check.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_System_WinRT"] }
windows-future = "0.3.2"
